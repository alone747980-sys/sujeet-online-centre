<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sujeet Online Centre</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    /* HEADER */
    header {
      height: 78px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
    }

    .site-name {
      font-size: 20px;
      font-weight: bold;
      color: #111;
    }

    .menu-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-icon {
      font-size: 27px;
      cursor: pointer;
    }

    .menu {
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      min-height: 600px;
      padding: 90px 18px 50px;
      text-align: center;
      background: linear-gradient(145deg, #f20d24, #a71991, #172de5);
    }

    .hero h1 {
      color: white;
      font-size: 36px;
      line-height: 1.35;
      max-width: 800px;
      margin: auto;
      margin-bottom: 55px;
    }

    /* SEARCH */
    .search-box {
      display: flex;
      max-width: 620px;
      margin: auto;
      height: 64px;
    }

    .search-box input {
      flex: 1;
      border: none;
      padding: 0 25px;
      font-size: 19px;
      outline: none;
    }

    .search-box button {
      width: 100px;
      border: none;
      background: #30343b;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    /* CARDS */
    .cards-container {
      max-width: 1000px;
      background: white;
      margin: -5px auto 40px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      position: relative;
      z-index: 10;
    }

    .card {
      min-height: 125px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 15px rgba(0,0,0,0.25);
    }

    .red {
      background: linear-gradient(135deg, #f01438, #bd0031);
    }
