<html lang="hi">

    * {

    }

    body {

      color: #222;
    }

    a {
      text-decoration: none;
    }

    /* ================= HEADER ================= */

    header {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .header-top {
      max-width: 1200px;
      min-height: 70px;
      margin: auto;
      padding: 7px 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: #111;
    }

    .brand-name span {
      color: #185dd8;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-btn {
      background: #35109b;
      color: white;
      padding: 9px 14px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      font-size: 27px;
      cursor: pointer;
    }

    /* ================= NAVIGATION ================= */

    nav {
      background: white;
      border-top: 1px solid #eee;
    }

    .nav-inner {
      max-width: 1200px;
      min-height: 45px;
      margin: auto;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      padding: 5px;
    }

    .nav-inner a {
      color: #222;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-inner a:hover {
      color: #1559d6;
    }

    /* ================= MOBILE MENU ================= */

    .mobile-menu {
      display: none;
      background: white;
      border-top: 1px solid #ddd;
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 13px 18px;
      color: #222;
      border-bottom: 1px solid #eee;
      font-weight: 600;
    }

    /* ================= HERO ================= */

    .hero {
      background: linear-gradient(
        135deg,
        #0d47a1,
        #1976d2
      );

      color: white;
      text-align: center;
      padding: 40px 15px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 15px;
    }

    /* ================= CONTAINER ================= */

    .container {
      width: calc(100% - 30px);
      max-width: 1000px;
      margin: 30px auto;
    }

    .page-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .page-title h2 {
      color: #0d47a1;
      font-size: 25px;
    }

    .page-title p {
      color: #666;
      margin-top: 6px;
    }

    /* ================= SEARCH ================= */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 13px;

      border: 1px solid #ddd;
      border-radius: 8px;

      font-size: 15px;
      outline: none;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;

      border-radius: 12px;

      box-shadow:

      border-left: 5px solid #1976d2;
    }

    .card h3 {
      color: #0d47a1;
      margin-bottom: 10px;
      font-size: 19px;
    }

    .card p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .details {
      background: #f5f8fc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .details div {
      margin: 6px 0;
      font-size: 14px;
    }

    .btn {
      display: inline-block;

      background: #1976d2;
      color: white;

      padding: 11px 18px;
      border-radius: 7px;

      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #0d47a1;
    }
